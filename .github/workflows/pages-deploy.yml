name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build static site
        run: |
          mkdir -p "_site${{ steps.pages.outputs.base_path }}"
          cp index.html "_site${{ steps.pages.outputs.base_path }}/"
          cp .nojekyll "_site${{ steps.pages.outputs.base_path }}/"
          cp stylesheet_new.css "_site${{ steps.pages.outputs.base_path }}/"
          cp image.png "_site${{ steps.pages.outputs.base_path }}/"
          cp image_ver.png "_site${{ steps.pages.outputs.base_path }}/"
          cp -R assets "_site${{ steps.pages.outputs.base_path }}/"
          cp -R images "_site${{ steps.pages.outputs.base_path }}/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
